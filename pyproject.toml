[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "lingualoop"
version = "0.1.0"
description = "A conversational language learning platform built around reviewable learning loops."
requires-python = ">=3.11"
dependencies = [
    "dotenv>=0.9.9",
    "langchain-openai>=1.6.0",
    "langgraph>=0.2",
    "loguru>=0.7.3",
    "pydantic>=2",
    "python-docx>=1.1",
    "typing-extensions>=4.12",
]

[project.optional-dependencies]
desktop = [
    "PySide6==6.11.1",
]
dev = [
    "pytest>=8",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=8",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"lingualoop.desktop" = ["qml/*.qml"]

[project.scripts]
lingualoop = "lingualoop.cli:main"
lingualoop-desktop = "lingualoop.desktop.app:main"
